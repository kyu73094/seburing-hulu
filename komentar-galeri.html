<!-- ====================================================================
     KOMENTAR GALERI — Seburing Hulu
     Database: Firebase Firestore (gratis, tanpa server, cocok untuk
     GitHub Pages karena situs Anda statis / tidak punya backend).

     CARA PASANG:
     1. Buka https://console.firebase.google.com -> buat project baru (gratis).
     2. Di project, klik "Build" -> "Firestore Database" -> "Create database"
        -> pilih mode "Start in test mode" (biar bisa langsung dipakai).
     3. Klik ikon "</>" (Web app) di halaman utama project untuk daftar
        aplikasi web, kasih nama bebas, lalu copy "firebaseConfig" yang
        muncul. Ganti bagian firebaseConfig di bawah ini dengan punya Anda.
     4. Copy SEMUA kode di bawah ini, lalu tempel ke dalam galeri.html,
        persis sebelum tag </body> (di paling bawah halaman).
     5. Upload ulang galeri.html ke GitHub, tunggu 1-2 menit, lalu coba
        buka halaman Galeri dan kirim komentar percobaan.

     CATATAN KEAMANAN:
     "Test mode" di Firestore membuat data bisa dibaca & ditulis siapa
     saja selama 30 hari, lalu terkunci otomatis. Sebelum itu, buka
     "Firestore Database" -> tab "Rules" dan ganti isinya jadi:

       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /komentar_galeri/{docId} {
             allow read: if true;
             allow create: if request.resource.data.nama is string
               && request.resource.data.nama.size() < 60
               && request.resource.data.email is string
               && request.resource.data.email.size() < 100
               && request.resource.data.pesan is string
               && request.resource.data.pesan.size() < 500;
             allow update, delete: if false;
           }
         }
       }

     Ini mengizinkan semua orang membaca & mengirim komentar baru, tapi
     tidak bisa mengubah/menghapus punya orang lain.
==================================================================== -->

<section id="komentar-galeri" style="max-width:640px;margin:48px auto;padding:0 16px;font-family:inherit;">
  <h2 style="font-size:1.4rem;margin-bottom:4px;">Komentar</h2>
  <p style="color:#666;margin-top:0;margin-bottom:20px;">Tinggalkan kesan atau komentar Anda tentang galeri ini.</p>

  <form id="form-komentar" style="display:flex;flex-direction:column;gap:10px;margin-bottom:32px;">
    <input
      id="input-nama"
      type="text"
      placeholder="Nama Anda"
      maxlength="60"
      required
      style="padding:10px 12px;border:1px solid #ccc;border-radius:8px;font-size:1rem;"
    />
    <input
      id="input-email"
      type="email"
      placeholder="Email Anda"
      maxlength="100"
      required
      style="padding:10px 12px;border:1px solid #ccc;border-radius:8px;font-size:1rem;"
    />
    <textarea
      id="input-pesan"
      placeholder="Tulis komentar..."
      maxlength="500"
      required
      rows="3"
      style="padding:10px 12px;border:1px solid #ccc;border-radius:8px;font-size:1rem;resize:vertical;"
    ></textarea>
    <button
      type="submit"
      id="btn-kirim"
      style="align-self:flex-start;padding:10px 20px;border:none;border-radius:8px;background:#2d6a4f;color:#fff;font-size:1rem;cursor:pointer;"
    >Kirim Komentar</button>
    <p id="status-kirim" style="margin:0;font-size:0.9rem;"></p>
  </form>

  <div id="daftar-komentar" style="display:flex;flex-direction:column;gap:14px;">
    <p style="color:#888;">Memuat komentar...</p>
  </div>
</section>

<!-- Firebase SDK (via CDN, tidak perlu instalasi apapun) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // GANTI dengan firebaseConfig dari project Firebase Anda sendiri
  const firebaseConfig = {
    apiKey: "GANTI_DENGAN_API_KEY_ANDA",
    authDomain: "GANTI.firebaseapp.com",
    projectId: "GANTI_PROJECT_ID",
    storageBucket: "GANTI.appspot.com",
    messagingSenderId: "GANTI",
    appId: "GANTI"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const komentarRef = collection(db, "komentar_galeri");

  const form = document.getElementById("form-komentar");
  const inputNama = document.getElementById("input-nama");
  const inputEmail = document.getElementById("input-email");
  const inputPesan = document.getElementById("input-pesan");
  const statusEl = document.getElementById("status-kirim");
  const daftarEl = document.getElementById("daftar-komentar");
  const btnKirim = document.getElementById("btn-kirim");

  // Kirim komentar baru
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const nama = inputNama.value.trim();
    const email = inputEmail.value.trim();
    const pesan = inputPesan.value.trim();
    if (!nama || !email || !pesan) return;

    btnKirim.disabled = true;
    statusEl.textContent = "Mengirim...";
    statusEl.style.color = "#666";

    try {
      await addDoc(komentarRef, {
        nama,
        email,
        pesan,
        waktu: serverTimestamp()
      });
      inputNama.value = "";
      inputEmail.value = "";
      inputPesan.value = "";
      statusEl.textContent = "Komentar terkirim. Terima kasih!";
      statusEl.style.color = "#2d6a4f";
    } catch (err) {
      statusEl.textContent = "Gagal mengirim komentar. Coba lagi.";
      statusEl.style.color = "#b91c1c";
      console.error(err);
    } finally {
      btnKirim.disabled = false;
    }
  });

  // Tampilkan komentar secara realtime, terbaru di atas
  const q = query(komentarRef, orderBy("waktu", "desc"));
  onSnapshot(q, (snapshot) => {
    if (snapshot.empty) {
      daftarEl.innerHTML = "<p style='color:#888;'>Belum ada komentar. Jadilah yang pertama!</p>";
      return;
    }
    daftarEl.innerHTML = "";
    snapshot.forEach((doc) => {
      const d = doc.data();
      const waktuStr = d.waktu?.toDate
        ? d.waktu.toDate().toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" })
        : "";
      const item = document.createElement("div");
      item.style.cssText = "border-bottom:1px solid #eee;padding-bottom:12px;";
      item.innerHTML = `
        <div style="font-weight:600;">${escapeHtml(d.nama || "Anonim")}</div>
        <div style="color:#444;margin:4px 0;">${escapeHtml(d.pesan || "")}</div>
        <!-- Email tidak ditampilkan ke publik demi privasi, hanya tersimpan di database -->
      
        <div style="color:#999;font-size:0.8rem;">${waktuStr}</div>
      `;
      daftarEl.appendChild(item);
    });
  }, (err) => {
    daftarEl.innerHTML = "<p style='color:#b91c1c;'>Gagal memuat komentar.</p>";
    console.error(err);
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>
