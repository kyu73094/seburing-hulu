<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hubungi Kami — Seburing Hulu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --header-bg:#EFE6EC;
    --hero-purple:#3E2A63;
    --hero-green:#173A2C;
    --eyebrow-green:#9ADB3C;
    --btn-purple-1:#7A3FA6;
    --btn-purple-2:#9B4FC0;
    --paper:#F4EFE3;
    --ink:#1E1B24;
    --muted:#6B6570;
    --line:#DED6C8;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    background:var(--paper);
  }
  a{ color:inherit; text-decoration:none; }
  h1{ font-family:'Fraunces', serif; font-weight:700; margin:0; }

  /* ---- header ---- */
  .site-header{
    background:var(--header-bg);
    padding:18px 0;
  }
  .site-header .container{
    max-width:720px;
    margin:0 auto;
    padding:0 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.35rem;
    color:#241A2E;
  }
  .brand .dot{
    width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #9ADB3C, #3E2A63 70%);
    flex-shrink:0;
  }
  .nav-toggle{
    background:none; border:none; font-size:1.5rem; color:#5B3A78; cursor:pointer;
    line-height:1;
  }

  /* ---- hero ---- */
  .hero{
    background:
      radial-gradient(120% 90% at 8% -10%, var(--hero-purple) 0%, transparent 55%),
      radial-gradient(120% 100% at 100% 120%, var(--hero-green) 0%, transparent 60%),
      linear-gradient(160deg, var(--hero-purple) 0%, var(--hero-green) 100%);
    color:#EFEAF2;
    padding:44px 0 60px;
  }
  .hero .container{ max-width:720px; margin:0 auto; padding:0 24px; }
  .eyebrow{
    font-size:.85rem;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--eyebrow-green);
    margin:0 0 18px;
  }
  .hero h1{
    font-size:clamp(2.2rem, 8vw, 3rem);
    line-height:1.12;
    color:#FFFFFF;
  }
  .hero .lede{
    margin-top:22px;
    max-width:44ch;
    font-size:1.08rem;
    line-height:1.6;
    color:#CFC9D6;
  }

  /* ---- form section ---- */
  .form-section{ padding:44px 0 80px; }
  .form-section .container{ max-width:720px; margin:0 auto; padding:0 24px; }
  form{ display:flex; flex-direction:column; gap:18px; }
  .field input,
  .field textarea{
    width:100%;
    padding:18px 20px;
    border-radius:14px;
    border:1px solid var(--line);
    background:#FFFFFF;
    font-family:inherit;
    font-size:1.05rem;
    color:var(--ink);
  }
  .field input::placeholder,
  .field textarea::placeholder{ color:#9C97A3; }
  .field textarea{ min-height:150px; resize:vertical; }
  .field input:focus,
  .field textarea:focus{
    outline:none;
    border-color:var(--btn-purple-2);
    box-shadow:0 0 0 3px rgba(123,63,166,.15);
  }

  button.submit{
    margin-top:6px;
    padding:18px 24px;
    border:none;
    border-radius:14px;
    background:linear-gradient(120deg, var(--btn-purple-1), var(--btn-purple-2));
    color:#fff;
    font-family:'Work Sans', sans-serif;
    font-weight:700;
    font-size:1.05rem;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  button.submit:hover{ opacity:.92; }
  button.submit:disabled{ opacity:.6; cursor:default; }

  #status-kirim{
    min-height:1.3em;
    font-size:.92rem;
    color:#3E6B49;
  }
  #status-kirim.error{ color:#B5502B; }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html"><span class="dot"></span>Seburing Hulu</a>
    <button class="nav-toggle" aria-label="Buka menu">☰</button>
  </div>
</header>

<section class="hero">
  <div class="container">
    <p class="eyebrow">Hubungi Kami</p>
    <h1>Kirim pesan untuk Seburing Hulu</h1>
    <p class="lede">Ada pertanyaan, saran, atau masukan untuk Seburing Hulu? Kirim pesan lewat form di bawah ini.</p>
  </div>
</section>

<section class="form-section">
  <div class="container">
    <form id="form-kontak">
      <div class="field">
        <input type="text" id="nama" name="nama" placeholder="Nama" required>
      </div>
      <div class="field">
        <input type="text" id="kontak" name="kontak" placeholder="Email / No. WhatsApp" required>
      </div>
      <div class="field">
        <textarea id="pesan" name="pesan" placeholder="Pesan" required></textarea>
      </div>
      <button type="submit" class="submit" id="btn-kirim">Kirim Pesan</button>
      <p id="status-kirim"></p>
    </form>
  </div>
</section>

<script>
  // Ganti dengan URL Web App hasil deploy Google Apps Script Anda.
  const SCRIPT_URL = "PASTE_URL_WEB_APP_ANDA_DI_SINI";

  const form = document.getElementById('form-kontak');
  const btn = document.getElementById('btn-kirim');
  const statusEl = document.getElementById('status-kirim');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    if (SCRIPT_URL.includes('PASTE_URL_WEB_APP')) {
      statusEl.textContent = 'SCRIPT_URL belum diisi — tempel URL Web App dari Google Apps Script.';
      statusEl.classList.add('error');
      return;
    }

    btn.disabled = true;
    statusEl.classList.remove('error');
    statusEl.textContent = 'Mengirim...';

    const data = new FormData(form);

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // Apps Script tidak mengirim header CORS, jadi respons dibaca sebagai "opaque"
      body: data
    })
      .then(function () {
        statusEl.textContent = 'Pesan terkirim, terima kasih!';
        form.reset();
      })
      .catch(function () {
        statusEl.textContent = 'Gagal mengirim. Periksa koneksi dan coba lagi.';
        statusEl.classList.add('error');
      })
      .finally(function () {
        btn.disabled = false;
      });
  });
</script>
</body>
</html>
